# back-web: forwards every request to Laravel's front controller in back-app (php-fpm).
# Reachable only inside the Docker network (Next's BFF, Caddy's TLS ask); never published.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 60m;
    server_tokens off;

    # Only index.php is ever executed; nothing under storage/ or public/ can run as PHP.
    location / {
        fastcgi_pass back-app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
