; Production PHP settings for the Laravel API.
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Images of 5 MB (media), product sheets of 8 MB, support chat videos of 50 MB.
upload_max_filesize = 55M
post_max_size = 60M
max_file_uploads = 10

; Errors go to the logs (JSON on stderr via LOG_CHANNEL=json), never to the response.
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code only changes by rebuilding the image.
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
