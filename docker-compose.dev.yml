# Development services only (the apps run on the host).
#   docker compose -f docker-compose.dev.yml up -d
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: landing
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 20

  mysql_test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: landing_test
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    tmpfs:
      - /var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql_dev_data:
